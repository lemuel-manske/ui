name: checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Build packages in dependency order
        run: npm run build

      - name: Validate package exports and runtime dependencies
        run: npm run check:packages

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run unit and browser tests
        run: npm test

      - name: Test release tooling
        run: npm run test:release

      - name: Build Storybook and validate agent documentation
        run: npm run build:docs

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-${{ github.sha }}
          path: packages/ui-components/storybook-static/
          retention-days: 30

      - name: Upload browser test diagnostics
        if: failure()

        uses: actions/upload-artifact@v7

        with:
          name: browser-test-results

          path: |
            packages/**/test-results/
            packages/**/playwright-report/

          if-no-files-found: ignore

          retention-days: 7
