name: ui @ docs

on:
  push:
    branches: [main]

    paths:
      - 'packages/**'
      - 'website/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/docs.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run build:docs

      - uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true
          path: website/dist/

  deploy:
    if: github.ref == 'refs/heads/main'

    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v5

      - uses: actions/deploy-pages@v4

        id: deployment
