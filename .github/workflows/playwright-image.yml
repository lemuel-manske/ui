name: ui @ visual image

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - docker/playwright/Dockerfile
      - .github/workflows/playwright-image.yml

  workflow_dispatch:

permissions:
  contents: read

  packages: write

concurrency:
  group: visual-image-${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:
  publish:
    name: Publish image

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/playwright/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ui-visual-tests:latest
