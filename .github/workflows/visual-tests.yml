name: Visual tests

on:
  pull_request:

  push:
    branches:
      - main
      - 'feat/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-tests-${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:
  discover:
    name: Discover workspaces

    runs-on: ubuntu-latest

    outputs:
      workspaces: ${{ steps.workspaces.outputs.workspaces }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find workspaces with visual tests
        id: workspaces
        shell: bash
        run: |
          workspaces="$(npm query --json '.workspace' | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => {
              input += chunk;
            });
            process.stdin.on("end", () => {
              const names = JSON.parse(input)
                .filter((workspace) => workspace.scripts?.["test:visual"])
                .map((workspace) => workspace.name);
              process.stdout.write(JSON.stringify(names));
            });
          ')"
          echo "workspaces=$workspaces" >> "$GITHUB_OUTPUT"
          echo "Visual test workspaces: $workspaces"

  visual:
    name: Visual (${{ matrix.workspace }})

    needs: discover

    if: ${{ needs.discover.outputs.workspaces != '[]' }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.discover.outputs.workspaces) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Match container user to runner user
        shell: bash
        run: |
          echo "DOCKER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DOCKER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Run visual tests
        shell: bash
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: npm run test:visual --workspace "$WORKSPACE"
