name: ui @ visual tests

on:
  pull_request:

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-tests-${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:
  visual:
    name: Visual tests

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - shell: bash
        run: |
          echo "DOCKER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DOCKER_GID=$(id -g)" >> "$GITHUB_ENV"

      - shell: bash
        run: npm run test:visual
