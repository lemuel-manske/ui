services:
  playwright:
    build:
      context: ../..
      dockerfile: docker/playwright/Dockerfile

    working_dir: /workspace

    user: '${DOCKER_UID:-1000}:${DOCKER_GID:-1000}'

    environment:
      CI: 'true'

      LANG: C.UTF-8

      LC_ALL: C.UTF-8

      TZ: UTC

    volumes:
      - ../..:/workspace
      - playwright_node_modules:/workspace/node_modules

volumes:
  playwright_node_modules:
